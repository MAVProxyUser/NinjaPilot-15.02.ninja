# ttyGS0 does not exist until usbotg-config.service binds the ACM function to
# the UDC, which happens at multi-user.target - well after getty.target would
# normally start us. serial-getty@.service ships Restart=always/RestartSec=0,
# so without this drop-in systemd burns its default 5-starts-in-10s limit long
# before the device node appears and then gives up permanently.
[Unit]
After=usbotg-config.service
Wants=usbotg-config.service
StartLimitIntervalSec=0

[Service]
RestartSec=2
